<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>广乐 · 首页</title>
<style>
  :root{
    --blue:#1A73E8;
    --ink:#14202E;
    --ink-2:#5B6879;
    --ink-3:#98A3B1;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;background:#E7EBF1;width:390px;}
  body{
    font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    margin:0 auto;
  }
  .phone{
    position:relative;
    width:390px;height:844px;
    overflow:hidden;
    isolation:isolate;
    /* 浅色液态大理石渐变底 */
    background:
      radial-gradient(120% 80% at 12% 0%,  #FFFFFF 0%, rgba(255,255,255,0) 55%),
      radial-gradient(90% 70% at 88% 6%,   #E3EBFA 0%, rgba(227,235,250,0) 62%),
      radial-gradient(80% 60% at 100% 40%, #F3E9E2 0%, rgba(243,233,226,0) 60%),
      radial-gradient(95% 70% at 0% 62%,   #EAF1FB 0%, rgba(234,241,251,0) 58%),
      radial-gradient(120% 90% at 50% 110%,#F7F3EF 0%, rgba(247,243,239,0) 60%),
      linear-gradient(165deg,#FBFCFE 0%,#F1F4F9 42%,#EEF2F8 100%);
  }
  /* 大理石流纹（SVG 噪声/曲线，作为底层质感） */
  .marble{
    position:absolute;inset:0;z-index:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none;
  }
  /* 细网点纹理 */
  .dots{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background-image:radial-gradient(rgba(26,115,232,.16) 1px, transparent 1px);
    background-size:7px 7px;
    background-position:0 0;
    -webkit-mask-image:radial-gradient(120% 80% at 50% 42%, #000 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.15) 75%, rgba(0,0,0,0) 100%);
            mask-image:radial-gradient(120% 80% at 50% 42%, #000 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.15) 75%, rgba(0,0,0,0) 100%);
  }
  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 20px 0;
  }
  .brand{
    display:flex;align-items:baseline;gap:8px;
  }
  .brand h1{
    margin:0;
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Times New Roman",serif;
    font-size:27px;font-weight:700;letter-spacing:2px;color:#101B28;
    line-height:1;
  }
  .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);transform:translateY(-8px);opacity:.9;}
  .search{
    display:flex;align-items:center;gap:7px;
    height:38px;padding:0 15px 0 13px;
    border-radius:19px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 2px 10px rgba(24,44,72,.07), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
  }
  .search svg{display:block;opacity:.62;}
  .search span{font-size:13px;color:var(--ink-3);letter-spacing:.3px;}

  /* ---------- 分段胶囊 Tab ---------- */
  .tabs{
    margin:22px auto 0;
    display:flex;align-items:center;
    padding:4px;
    border-radius:22px;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 6px 20px rgba(24,44,72,.06), inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
  }
  .tabs .tab{
    padding:8px 17px;border-radius:18px;
    font-size:13px;letter-spacing:.6px;color:#4A5768;white-space:nowrap;
  }
  .tabs .tab.on{
    background:var(--blue);color:#fff;font-weight:600;
    box-shadow:0 6px 14px rgba(26,115,232,.34), inset 0 1px 0 rgba(255,255,255,.35);
  }

  /* ---------- Coverflow ---------- */
  .stage{
    position:relative;
    margin-top:52px;
    height:330px;
  }
  .card{
    position:absolute;left:50%;top:50%;
    width:150px;height:196px;
    margin-left:-75px;margin-top:-98px;
    background:#fff;
    padding:7px 7px 0;
    border-radius:4px;
    box-shadow:0 14px 30px rgba(22,40,66,.16), 0 2px 6px rgba(22,40,66,.08);
    transform-origin:50% 60%;
  }
  .card .art{
    width:100%;height:158px;border-radius:2px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC","Noto Serif CJK SC",serif;
  }
  .card .art .glyph{font-size:34px;letter-spacing:2px;color:rgba(255,255,255,.92);text-shadow:0 2px 10px rgba(0,0,0,.15);}
  .card .cap{
    height:30px;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;letter-spacing:1px;color:#7B8795;
  }
  .c3{transform:translateX(-1px) scale(1.25);z-index:5;box-shadow:0 26px 46px rgba(20,38,64,.24), 0 4px 10px rgba(20,38,64,.1);padding:8px 8px 0;}
  .c3 .art{height:196px;}
  .c3 .cap{height:34px;font-size:10px;color:#3C4B5D;}
  .c2{transform:translateX(-118px) scale(.9) rotate(-7deg);z-index:4;opacity:.9;}
  .c4{transform:translateX(116px) scale(.9) rotate(7deg);z-index:4;opacity:.9;}
  .c1{transform:translateX(-208px) scale(.74) rotate(-13deg);z-index:3;opacity:.55;filter:saturate(.75);}
  .c5{transform:translateX(206px) scale(.74) rotate(13deg);z-index:3;opacity:.55;filter:saturate(.75);}
  .shadow-floor{
    position:absolute;left:50%;bottom:2px;width:240px;height:22px;margin-left:-120px;
    background:radial-gradient(ellipse at center, rgba(20,38,64,.18), rgba(20,38,64,0) 70%);
    filter:blur(6px);
  }

  /* 封面各自的配色（低饱和大理石/矿物色） */
  .a1{background:radial-gradient(120% 100% at 20% 10%,#9FB6D6,#5C7BA6 55%,#3D5578);}
  .a2{background:radial-gradient(120% 100% at 80% 0%,#F1D3BE,#C8946E 60%,#9A6A48);}
  .a3{background:radial-gradient(110% 90% at 30% 0%,#E8ECF2,#C3CEDA 45%,#8E9DB0);}
  .a4{background:radial-gradient(120% 100% at 70% 100%,#CFE0D6,#8FAF9E 60%,#5F7E6E);}
  .a5{background:radial-gradient(120% 100% at 20% 90%,#E7D9E4,#B49AB2 60%,#7B6480);}
  .a1:after,.a2:after,.a3:after,.a4:after,.a5:after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 40% at 25% 18%, rgba(255,255,255,.42), rgba(255,255,255,0) 70%);
  }

  /* ---------- 标题区 ---------- */
  .headline{
    padding:34px 26px 0;
  }
  .headline h2{
    margin:0;
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
    font-size:30px;font-weight:700;letter-spacing:1.5px;color:#101B28;
  }
  .headline p{
    margin:9px 0 0;font-size:12.5px;line-height:20px;color:var(--ink-2);letter-spacing:.4px;
  }
  .headline p .sep{color:#C6CFDA;margin:0 6px;}

  /* ---------- 悬浮迷你播放条 ---------- */
  .mini{
    position:absolute;left:16px;right:16px;bottom:16px;z-index:20;
    display:flex;align-items:center;gap:11px;
    padding:10px 12px 10px 10px;
    border-radius:28px;
    background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 14px 34px rgba(24,44,72,.16), 0 2px 6px rgba(24,44,72,.06), inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
  }
  .mini .thumb{
    width:44px;height:44px;border-radius:50%;flex:none;
    background:radial-gradient(120% 100% at 30% 20%,#F1D3BE,#C8946E 60%,#9A6A48);
    box-shadow:0 3px 8px rgba(24,44,72,.18), inset 0 0 0 1.5px rgba(255,255,255,.85);
  }
  .mini .meta{flex:1;min-width:0;}
  .mini .meta .t{font-size:13px;font-weight:600;color:#152131;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini .meta .s{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.3px;}
  .mini .bar{
    margin-top:7px;height:2.5px;border-radius:2px;background:rgba(26,115,232,.16);overflow:hidden;
  }
  .mini .bar i{display:block;height:100%;width:38%;border-radius:2px;background:var(--blue);}
  .mini .play{
    width:42px;height:42px;border-radius:50%;flex:none;
    background:var(--blue);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(26,115,232,.38), inset 0 1px 0 rgba(255,255,255,.35);
  }
</style>
</head>
<body>
<div class="phone">
  <!-- 大理石流纹 -->
  <svg class="marble" width="390" height="844" viewBox="0 0 390 844" fill="none" preserveAspectRatio="none">
    <defs>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
      <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#B9C7DA" stop-opacity=".0"/>
        <stop offset=".45" stop-color="#A9BACE" stop-opacity=".55"/>
        <stop offset="1" stop-color="#CBBFB4" stop-opacity=".0"/>
      </linearGradient>
      <linearGradient id="vein2" x1="1" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#C9D6E8" stop-opacity=".0"/>
        <stop offset=".5" stop-color="#C2D2E6" stop-opacity=".45"/>
        <stop offset="1" stop-color="#E3D5C8" stop-opacity=".0"/>
      </linearGradient>
    </defs>
    <g filter="url(#soft)">
      <path d="M-20 120 C 70 90, 130 190, 210 160 S 330 60, 420 110" stroke="url(#vein)" stroke-width="26" fill="none"/>
      <path d="M-20 300 C 90 260, 150 380, 250 330 S 350 240, 420 300" stroke="url(#vein2)" stroke-width="34" fill="none"/>
      <path d="M-20 520 C 80 470, 170 600, 260 540 S 350 430, 420 500" stroke="url(#vein)" stroke-width="22" fill="none"/>
      <path d="M-20 700 C 100 650, 160 780, 270 720 S 350 640, 420 690" stroke="url(#vein2)" stroke-width="30" fill="none"/>
    </g>
  </svg>
  <div class="dots"></div>

  <div class="content">
    <div class="topbar">
      <div class="brand">
        <h1>广乐</h1><span class="dot"></span>
      </div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B6879" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/>
        </svg>
        <span>搜索歌曲、歌手</span>
      </div>
    </div>

    <div class="tabs">
      <div class="tab on">歌单</div>
      <div class="tab">电台</div>
      <div class="tab">专辑</div>
      <div class="tab">本地</div>
    </div>

    <div class="stage">
      <div class="shadow-floor"></div>

      <div class="card c1">
        <div class="art a1"><span class="glyph">晨</span></div>
        <div class="cap">MORNING CYCLE</div>
      </div>

      <div class="card c2">
        <div class="art a4"><span class="glyph">苔</span></div>
        <div class="cap">MOSS / 12</div>
      </div>

      <div class="card c3">
        <div class="art a2"><span class="glyph">潮</span></div>
        <div class="cap">潮汐与琥珀 · 广乐原声</div>
      </div>

      <div class="card c4">
        <div class="art a5"><span class="glyph">夜</span></div>
        <div class="cap">NIGHT PIECES</div>
      </div>

      <div class="card c5">
        <div class="art a3"><span class="glyph">雪</span></div>
        <div class="cap">SNOW ROOM</div>
      </div>
    </div>

    <div class="headline">
      <h2>为你精选</h2>
      <p>根据你最近的收听口味，挑选了 32 首安静的作品。<span class="sep">·</span>适合清晨与通勤</p>
    </div>
  </div>

  <div class="mini">
    <div class="thumb"></div>
    <div class="meta">
      <div class="t">潮汐与琥珀</div>
      <div class="s">林间计划 · 04:12</div>
      <div class="bar"><i></i></div>
    </div>
    <div class="play">
      <svg width="14" height="16" viewBox="0 0 14 16" fill="#fff"><path d="M1 1.4c0-.9 1-1.4 1.7-.9l10 6c.7.4.7 1.4 0 1.8l-10 6c-.7.5-1.7 0-1.7-.9V1.4z"/></svg>
    </div>
  </div>
</div>
</body>
</html>
