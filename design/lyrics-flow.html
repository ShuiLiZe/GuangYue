<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>广乐 · 歌词流</title>
<style>
  :root{
    --blue:#1A73E8;
    --seed:#C8946E;
    --ink:#0F1A2B;      /* 当前行：深蓝黑 */
    --ink-soft:#33415A;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;background:#D9D3CB;width:390px;}
  body{
    font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    margin:0 auto;
  }
  .phone{
    position:relative;width:390px;height:844px;overflow:hidden;isolation:isolate;
    /* 封面主色 #C8946E 取色生成的模糊渐变 */
    background:
      radial-gradient(70% 46% at 22% 6%,  rgba(200,148,110,.95) 0%, rgba(200,148,110,0) 62%),
      radial-gradient(60% 40% at 88% 2%,  rgba(232,196,160,.92) 0%, rgba(232,196,160,0) 60%),
      radial-gradient(90% 50% at 50% 34%, rgba(244,228,212,.95) 0%, rgba(244,228,212,0) 65%),
      radial-gradient(80% 50% at 8% 62%,  rgba(196,142,120,.62) 0%, rgba(196,142,120,0) 62%),
      radial-gradient(80% 50% at 96% 78%, rgba(170,120,96,.42) 0%, rgba(170,120,96,0) 62%),
      linear-gradient(180deg,#F3E4D6 0%,#EFE3D9 38%,#E9E0DA 68%,#DFD7D2 100%);
  }
  /* 大色斑（模拟取色后的柔和光晕） */
  .blob{position:absolute;z-index:0;border-radius:50%;filter:blur(60px);pointer-events:none;}
  .b1{width:300px;height:300px;left:-90px;top:-70px;background:rgba(200,148,110,.55);}
  .b2{width:260px;height:260px;right:-90px;top:70px;background:rgba(240,214,186,.75);}
  .b3{width:340px;height:300px;left:-40px;top:290px;background:rgba(238,226,214,.85);}
  /* 细噪声/网纹，压住模糊感 */
  .grain{
    position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(120,88,64,.14) 1px, transparent 1px);
    background-size:5px 5px;mix-blend-mode:multiply;
  }

  .page{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;}

  /* ---------- 顶部 ---------- */
  .header{
    display:flex;align-items:center;gap:12px;
    padding:22px 20px 0;
  }
  .back{
    width:36px;height:36px;border-radius:50%;flex:none;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    box-shadow:0 4px 14px rgba(120,88,64,.14);
  }
  .head-cover{
    width:36px;height:36px;border-radius:10px;flex:none;
    background:radial-gradient(120% 100% at 30% 20%,#F1D3BE,#C8946E 58%,#8E6244);
    box-shadow:0 4px 12px rgba(120,88,64,.28), inset 0 0 0 1px rgba(255,255,255,.5);
  }
  .head-meta{flex:1;min-width:0;}
  .head-meta .t{font-size:13.5px;font-weight:650;color:#1A2433;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .head-meta .s{font-size:11px;color:rgba(40,52,70,.55);margin-top:2px;letter-spacing:.4px;}
  .more{
    width:30px;flex:none;text-align:right;color:rgba(40,52,70,.5);font-size:18px;letter-spacing:1px;line-height:1;
  }

  /* ---------- 歌词流 ---------- */
  .flow{
    flex:1;
    padding:40px 28px 0;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    overflow:hidden;
  }
  .lrow{
    font-weight:800;
    letter-spacing:-.2px;
    line-height:1.16;
    color:var(--ink);
    transition:all .3s ease;
    transform-origin:left center;
  }
  /* 远离的越淡越模糊 */
  .lrow.f1{opacity:.10;filter:blur(3.4px);font-size:20px;}
  .lrow.f2{opacity:.20;filter:blur(2.4px);font-size:24px;}
  .lrow.f3{opacity:.36;filter:blur(1.4px);font-size:28px;}
  .lrow.cur{
    opacity:1;filter:blur(0);font-size:36px;
    color:var(--ink);
    letter-spacing:0;
    line-height:1.18;
    margin:8px 0;
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .lrow.n1{opacity:.30;filter:blur(1.6px);font-size:30px;color:#243047;}
  .lrow.n2{opacity:.16;filter:blur(2.8px);font-size:26px;color:#2A3852;}
  .lrow.n3{opacity:.08;filter:blur(4px);font-size:22px;color:#2A3852;}

  /* ---------- 底部控制条 ---------- */
  .controls{
    position:relative;z-index:5;
    margin:0 16px 16px;
    border-radius:30px;
    padding:16px 20px 18px;
    background:rgba(16,24,38,.82);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 44px rgba(40,30,22,.34), inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(26px) saturate(160%);
    -webkit-backdrop-filter:blur(26px) saturate(160%);
  }
  .track{display:flex;align-items:center;gap:10px;}
  .track .tm{font-size:10px;letter-spacing:.5px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums;}
  .track .rail{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.15);position:relative;}
  .track .rail i{position:absolute;left:0;top:0;bottom:0;width:44%;border-radius:2px;background:var(--blue);box-shadow:0 0 10px rgba(26,115,232,.7);}
  .track .rail b{position:absolute;left:44%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(120,180,255,.9);}
  .btns{
    margin-top:16px;display:flex;align-items:center;justify-content:center;gap:44px;
  }
  .btns .ico{display:flex;align-items:center;justify-content:center;opacity:.85;}
  .btns .play{
    width:56px;height:56px;border-radius:50%;
    background:var(--blue);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px rgba(26,115,232,.5), inset 0 1px 0 rgba(255,255,255,.3);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grain"></div>

  <div class="page">
    <div class="header">
      <div class="back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#33415A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </div>
      <div class="head-cover"></div>
      <div class="head-meta">
        <div class="t">潮汐与琥珀</div>
        <div class="s">林间计划 · 潮汐与琥珀</div>
      </div>
      <div class="more">⋯</div>
    </div>

    <div class="flow">
      <div class="lrow f1">把夜色折进信封</div>
      <div class="lrow f2">等一场迟到很久的雨</div>
      <div class="lrow f3">潮汐涌上来</div>
      <div class="lrow cur">淹没我呼吸的声音</div>
      <div class="lrow n1">在最深的蓝里</div>
      <div class="lrow n2">而你是唯一的航标</div>
      <div class="lrow n3">照着我不敢说的名字</div>
    </div>

    <div class="controls">
      <div class="track">
        <span class="tm">01:51</span>
        <div class="rail"><i></i><b></b></div>
        <span class="tm">04:12</span>
      </div>
      <div class="btns">
        <div class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
            <rect x="4" y="5" width="2.4" height="14" rx="1"/>
            <path d="M20 6.2v11.6c0 .8-.9 1.3-1.6.8L10 12.8V19l-4-3.5 4-3.5v.2l8.4-6.8c.7-.5 1.6 0 1.6.8z"/>
          </svg>
        </div>
        <div class="play">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="#fff"><rect x="1.5" y="1" width="4" height="14" rx="1"/><rect x="8.5" y="1" width="4" height="14" rx="1"/></svg>
        </div>
        <div class="ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff">
            <rect x="17.6" y="5" width="2.4" height="14" rx="1"/>
            <path d="M4 6.2v11.6c0 .8.9 1.3 1.6.8L14 12.8V19l4-3.5-4-3.5v.2L5.6 5.4C4.9 4.9 4 5.4 4 6.2z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
