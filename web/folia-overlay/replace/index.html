<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 绉诲姩绔細viewport-fit=cover 璁?WebView 閾哄埌鍒樻捣涓嬮潰锛屽畨鍏ㄥ尯浜ょ粰 styles/mobile.css 鐨?env()銆?-->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>骞夸箰</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <style>
      html,
      body {
        background-color: #09090b;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 320ms ease;
      }
      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        opacity: 0;
        animation: app-splash-in 420ms ease 180ms forwards;
      }
      #app-splash .app-splash-title {
        font-size: clamp(64px, 17vw, 200px);
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.06em;
        text-indent: 0.06em;
      }
      #app-splash .app-splash-title span {
        display: inline-block;
        text-align: center;
        font-family: inherit;
        color: #ffffff;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.55), 0 0 28px rgba(255, 255, 255, 0.3);
        transform-origin: center 78%;
      }
      #app-splash .app-splash-wave {
        display: flex;
        align-items: center;
        gap: clamp(6px, 1.1vw, 11px);
        height: clamp(42px, 7.5vw, 92px);
      }
      #app-splash .app-splash-wave span {
        width: var(--w, 5px);
        height: 100%;
        transform: scaleY(var(--floor, 0.18));
        background-color: rgba(255, 255, 255, var(--alpha, 0.85));
        box-shadow: 0 0 var(--glow, 14px) rgba(255, 255, 255, 0.35);
        animation: app-splash-wave 1100ms ease-in-out infinite;
      }
      #app-splash .app-splash-wave span:nth-child(even) {
        animation-delay: -550ms;
      }
      @keyframes app-splash-in {
        to {
          opacity: 1;
        }
      }
      @keyframes app-splash-wave {
        0%,
        100% {
          transform: scaleY(var(--floor, 0.18));
        }
        50% {
          transform: scaleY(var(--peak, 1));
        }
      }
    </style>
  </head>
  <body>
    <!--
      鍚姩闂睆娌跨敤 Folia 瀹樻柟鐨勫瓧褰㈣疆鐩橈細瑙嗚涓€妯′竴鏍凤紝鍙槸鎶婁簲涓瓧姣嶆崲鎴愩€屽箍 / 涔愩€嶄笌 Folia
      鍏辩敤鐨勯偅濂楅殢鏈哄瓧褰€俁eact 鎸傝浇鍚庣敱 src/utils/appSplash.ts 娣″嚭绉婚櫎銆?    -->
    <div id="app-splash" role="status" aria-live="polite" aria-label="姝ｅ湪杞藉叆骞夸箰">
      <div class="app-splash-inner">
        <div class="app-splash-title" aria-label="骞夸箰"><span>G</span><span>u</span><span>a</span><span>n</span><span>g</span><span>Y</span><span>u</span><span>e</span></div>
        <div class="app-splash-wave" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          var rand = function (min, max) {
            return min + Math.random() * (max - min);
          };
          var bars = document.querySelectorAll('#app-splash .app-splash-wave span');
          for (var i = 0; i < bars.length; i += 1) {
            var bar = bars[i];
            var envelope = Math.sin(((i + 0.5) / bars.length) * Math.PI);
            bar.style.setProperty('--peak', Math.min(1, 0.32 + envelope * rand(0.38, 0.72)).toFixed(3));
            bar.style.setProperty('--floor', rand(0.08, 0.24).toFixed(3));
            bar.style.setProperty('--w', rand(3.5, 6.5).toFixed(2) + 'px');
            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          /* 闅忔満鐨勫け璐ヤ笉褰卞悜澶栬锛孋SS 榛樿鍊煎凡缁忓鐢ㄣ€?*/
        }
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var BASE_FONT = "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif";
          var FAMILIES = [BASE_FONT, 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui'];
          var WEIGHTS = ['400', '600', '800'];
          var SCALES = [0.86, 0.94, 1, 1.06, 1.12];
          var letters = document.querySelectorAll('#app-splash .app-splash-title span');
          if (!letters.length) {
            return;
          }
          var measure = document.createElement('canvas').getContext('2d');
          for (var m = 0; m < letters.length; m += 1) {
            var glyph = letters[m].textContent;
            var widest = 0;
            for (var f = 0; f < FAMILIES.length; f += 1) {
              measure.font = 'italic 800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
              measure.font = '800 100px ' + FAMILIES[f];
              widest = Math.max(widest, measure.measureText(glyph).width);
            }
            if (widest > 0) {
              letters[m].style.width = ((widest / 100) * 1.26 + 0.04).toFixed(3) + 'em';
            }
          }
          var pick = function (list) {
            return list[Math.floor(Math.random() * list.length)];
          };
          var jitter = function (min, max) {
            return min + Math.random() * (max - min);
          };
          var randomGlow = function () {
            var roll = Math.random();
            if (roll < 0.3) {
              return '0 0 ' + (2 + Math.random() * 4).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            if (roll < 0.75) {
              return '0 0 ' + (6 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' + (20 + Math.random() * 16).toFixed(1) + 'px rgba(255,255,255,0.35)';
            }
            return '0 0 ' + (10 + Math.random() * 8).toFixed(1) + 'px rgba(255,255,255,0.95), 0 0 ' + (34 + Math.random() * 20).toFixed(1) + 'px rgba(255,255,255,0.7), 0 0 ' + (70 + Math.random() * 40).toFixed(1) + 'px rgba(255,255,255,0.45)';
          };
          var timer = window.setInterval(function () {
            if (!document.getElementById('app-splash')) {
              window.clearInterval(timer);
              return;
            }
            var swaps = Math.random() < 0.25 ? 2 : 1;
            for (var i = 0; i < swaps; i += 1) {
              var letter = pick(letters);
              letter.style.fontFamily = pick(FAMILIES);
              letter.style.fontWeight = pick(WEIGHTS);
              letter.style.fontStyle = Math.random() < 0.25 ? 'italic' : 'normal';
              var sizeScale = jitter(0.86, 1.12);
              letter.style.transform = 'scale(' + (sizeScale * pick(SCALES)).toFixed(3) + ',' + sizeScale.toFixed(3) + ')';
              letter.style.textShadow = randomGlow();
            }
          }, 380);
        } catch (error) {
          /* 瀛椾綋杞洏澶辫触灏变繚鎸侀潤鎬佸瓧褰€?*/
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
