name: 🤖 打包

# 触发方式：
#   1. push 到 main      → 打包 debug + release（都用发布密钥签，可直接覆盖安装）
#   2. push tag v*       → 额外创建 GitHub Release，把 APK 挂上去
#   3. 手动 Run workflow → 可选 debug / release / both
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '打包类型'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------
      # 签名密钥
      #   优先 Secrets.KEYS_BASE64（base64 的 .jks）→ 解码到 build/keystore/
      #   没有 Secret 时，app/build.gradle.kts 的 signingConfigs 回落到默认口令，
      #   而 keystore 文件由下面的 materialize 步骤从 SIGNING_KEY_JKS 生成。
      # 口令类 Secret（KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS）缺省时
      # 同样由 build.gradle.kts 里的默认值兜底，保证 fork 也能出包。
      # ------------------------------------------------------------------
      - name: 还原签名密钥
        if: ${{ secrets.KEYS_BASE64 != '' }}
        env:
          KEYS_BASE64: ${{ secrets.KEYS_BASE64 }}
        run: |
          mkdir -p build/keystore
          printf '%s' "$KEYS_BASE64" | base64 -d > build/keystore/guangyue-release.jks
          echo "keystore 已还原：$(stat -c%s build/keystore/guangyue-release.jks) 字节"

      - name: 生成 local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 生成签名口令文件（可选）
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "guangyue.storePassword=${KS_PASS:-GuangYue2026Release}"
            echo "guangyue.keyPassword=${KEY_PASS:-GuangYue2026Release}"
            echo "guangyue.keyAlias=${KEY_ALIAS:-guangyue}"
            echo "guangyue.keystore=build/keystore/guangyue-release.jks"
          } >> gradle.properties

      - name: 打包 Debug
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 打包 Release
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --stacktrace --no-daemon

      # ------------------------------------------------------------------
      # 产物命名：GuangYue-v<version>-<sha7>-<variant>.apk
      # ------------------------------------------------------------------
      - name: 整理产物
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          ABB=${GITHUB_SHA::7}
          mkdir -p dist
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -f "$f" ] && cp "$f" "dist/GuangYue-v${VERSION}-${ABB}-debug.apk"
          done
          for f in app/build/outputs/apk/release/*.apk; do
            [ -f "$f" ] && cp "$f" "dist/GuangYue-v${VERSION}-${ABB}-release.apk"
          done
          ls -lh dist/

      - name: 校验签名
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --print-certs "$f" | head -3
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: GuangYue-APK-${{ github.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 创建 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 广乐 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*.apk
      - name: 创建 Release 时附带摘要
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "已发布 ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
