name: 🤖 打包

# 触发方式：
#   1. push 到 main      → 打包 debug + release（都用发布密钥签，可直接覆盖安装）
#   2. push tag v*       → 额外创建 GitHub Release，把 APK 挂上去
#   3. 手动 Run workflow → 可选 debug / release / both
#
# 签名密钥：仓库内 build/keystore/guangyue-release.jks.base64（base64 文本）被
# .gitignore 放行，CI 直接解码；不需要任何 Secret。配置了 KEYS_BASE64 Secret
# 时以 Secret 为准（换密钥不必改仓库）。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: '打包类型'
        required: true
        default: 'both'
        type: choice
        options: [debug, release, both]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 生成 local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # ------------------------------------------------------------------
      # 签名密钥
      #   - 优先 Secrets.KEYS_BASE64（可含换行）
      #   - 否则用仓库内 build/keystore/guangyue-release.jks.base64
      #   解码目标统一为 build/keystore/guangyue-release.jks
      # ------------------------------------------------------------------
      - name: 还原签名密钥
        env:
          KEY_B64_SECRET: ${{ secrets.KEYS_BASE64 }}
        run: |
          set -e
          mkdir -p build/keystore
          SRC=build/keystore/guangyue-release.jks.base64
          if [ -n "$KEY_B64_SECRET" ]; then
            printf '%s' "$KEY_B64_SECRET" | tr -d ' \r\n\t' > /tmp/key.b64
            echo "使用 Secret KEYS_BASE64"
          elif [ -f "$SRC" ]; then
            tr -d ' \r\n\t' < "$SRC" > /tmp/key.b64
            echo "使用仓库内 $SRC"
          else
            echo "::error::找不到签名密钥：既没有 Secret KEYS_BASE64，也没有 $SRC"
            exit 1
          fi
          base64 -d /tmp/key.b64 > build/keystore/guangyue-release.jks
          echo "keystore 字节数：$(stat -c%s build/keystore/guangyue-release.jks)"
          sha256sum build/keystore/guangyue-release.jks

      - name: 写入签名口令
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "guangyue.storePassword=${KS_PASS:-GuangYue2026Release}"
            echo "guangyue.keyPassword=${KEY_PASS:-GuangYue2026Release}"
            echo "guangyue.keyAlias=${KEY_ALIAS:-guangyue}"
            echo "guangyue.keystore=build/keystore/guangyue-release.jks"
          } >> gradle.properties

      - name: 打包 Debug
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: 打包 Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: ./gradlew :app:assembleRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --stacktrace --no-daemon

      # ------------------------------------------------------------------
      # 产物命名：GuangYue-v<version>-<sha7>-<variant>.apk
      # ------------------------------------------------------------------
      - name: 整理产物
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          ABB=${GITHUB_SHA::7}
          mkdir -p dist
          found=0
          for f in app/build/outputs/apk/debug/*.apk; do
            if [ -f "$f" ]; then cp "$f" "dist/GuangYue-v${VERSION}-${ABB}-debug.apk"; found=1; fi
          done
          for f in app/build/outputs/apk/release/*.apk; do
            if [ -f "$f" ]; then cp "$f" "dist/GuangYue-v${VERSION}-${ABB}-release.apk"; found=1; fi
          done
          if [ "$found" = "0" ]; then
            echo "::error::没有生成任何 APK，检查上面的编译日志"
            exit 1
          fi
          ls -lh dist/

      - name: 校验签名
        run: |
          set -e
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do
            echo "== $f"
            "$BT/apksigner" verify --print-certs "$f" | head -4 | tee /tmp/certs.txt
            if grep -q "CN=Android Debug" /tmp/certs.txt; then
              echo "::warning::$f 用的是调试证书，不是发布密钥"
            fi
          done

      # artifact 存储配额用满时这一步会失败（Failed to CreateArtifact:
      # Artifact storage quota has been hit），但编译与签名都已经完成，
      # 所以让它 continue-on-error：不因配额问题判定整个构建失败。
      # 同理，每次 push 都会上传 50MB 的包，长期会持续吃配额，
      # 想永久省掉就把这张任务注释掉，改用 tag 触发的 Release 附件取包。
      - name: 上传 APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GuangYue-APK-${{ github.sha }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: 创建 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 广乐 ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*.apk

      - name: 作业摘要
        if: always()
        run: |
          {
            echo "### 广乐打包结果"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in dist/*.apk; do
              [ -f "$f" ] && echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY
