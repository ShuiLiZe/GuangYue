name: 📱 模拟器取证

# port/u2 上提交信息带 [shots] 时：打 debug 包，起 360dp 模拟器（720x1600 @320dpi）跑 tools/ci_shots.sh，截图作产物。
on:
  push:
    branches: [port/u2]

jobs:
  shots:
    if: contains(github.event.head_commit.message, '[shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: 开 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew tools/ci_shots.sh && echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: 打包 debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: 模拟器取证
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./tools/ci_shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: shots-${{ github.sha }}
          path: shots/
          retention-days: 7
